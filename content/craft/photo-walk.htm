<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17171a;
    --bg-raised: #1d1d21;
    --paper: #f1ece0;
    --paper-dim: #cfc9bc;
    --line: #3a3a3e;
    --line-soft: #29292d;
    --ink: #e8e4da;
    --ink-dim: #8c8b86;
    --safelight: #b8562f;
    --safelight-dim: #6e3a22;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
    min-height: 100vh;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  header {
    text-align: left;
    margin-bottom: 36px;
    padding: 0 4px;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--safelight);
    margin: 0 0 10px 0;
  }

  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: 30px;
    line-height: 1.25;
    margin: 0 0 12px 0;
    color: var(--ink);
    max-width: 22ch;
  }

  header p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 46ch;
    margin: 0;
  }

  /* Film roll */
  .filmroll {
    background: #0f0f11;
    border: 1px solid var(--line);
  }

  .perf {
    height: 14px;
    background-color: #0f0f11;
    background-image: radial-gradient(circle at 8px 7px, var(--line) 3.5px, transparent 4px);
    background-size: 22px 14px;
    background-repeat: repeat-x;
  }

  .frames-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 18px 16px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }

  .frames-scroll::-webkit-scrollbar { height: 6px; }
  .frames-scroll::-webkit-scrollbar-track { background: transparent; }
  .frames-scroll::-webkit-scrollbar-thumb { background: var(--line); }

  .flip-card {
    flex-shrink: 0;
    width: 168px;
    height: 116px;
    perspective: 900px;
    scroll-snap-align: start;
    cursor: pointer;
  }

  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 550ms cubic-bezier(0.3, 0.1, 0.25, 1);
    transform-style: preserve-3d;
  }

  .flip-card.flipped .flip-inner {
    transform: rotateY(180deg);
  }

  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .flip-front {
    background: #131315;
    border: 1px solid var(--line-soft);
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 160ms ease, background 160ms ease;
  }

  .flip-card:hover .flip-front,
  .flip-card:focus-visible .flip-front {
    border-color: var(--safelight-dim);
    background: #17110c;
  }

  .frame-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
  }

  .frame-tap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--line);
  }

  .flip-back {
    background: var(--paper);
    border: 1px solid var(--paper-dim);
    transform: rotateY(180deg);
    padding: 14px 16px 12px;
    justify-content: center;
  }

  .back-index {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.04em;
    color: var(--safelight-dim);
    margin: 0 0 5px 0;
  }

  .hint {
    margin-top: 10px;
    padding: 0 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }

  .action-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    padding: 10px 16px;
    cursor: pointer;
    transition: border-color 160ms ease, color 160ms ease;
  }

  .action-btn:hover {
    border-color: var(--paper-dim);
    color: var(--ink);
    background: transparent;
  }

  footer {
    margin-top: 32px;
    padding: 0 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    border-top: 1px solid var(--line-soft);
    padding-top: 16px;
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px 0;
    cursor: pointer;
  }
  .reset-link:hover { color: var(--ink); background: none; }

  /* Add-prompt panel */
  .add-panel {
    margin-top: 28px;
    padding: 0 4px;
  }

  .add-toggle {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0;
    cursor: pointer;
  }
  .add-toggle:hover { color: var(--ink); background: none; }

  .add-form {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
  }

  .add-form.open { display: flex; }

  .add-form label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .add-form input,
  .add-form textarea {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 10px 12px;
    resize: vertical;
  }

  .add-form textarea { min-height: 64px; }

  .add-form input:focus,
  .add-form textarea:focus {
    outline: none;
    border-color: var(--safelight);
  }

  .add-form .add-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }

  .add-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--safelight);
    letter-spacing: 0.02em;
  }

  /* Enlarged frame modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 11, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-panel {
    position: relative;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--paper-dim);
    padding: 40px 30px 30px;
    transform: scale(0.94) translateY(6px);
    transition: transform 240ms cubic-bezier(0.3, 0.1, 0.25, 1);
  }

  .modal-overlay.open .modal-panel {
    transform: scale(1) translateY(0);
  }

  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    line-height: 1;
    color: #6b675f;
    cursor: pointer;
    padding: 8px;
  }
  .modal-close:hover { color: #17171a; background: none; }

  .modal-image {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    margin: -40px -30px 20px;
    display: block;
    width: calc(100% + 60px);
  }

  .modal-index {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--safelight-dim);
    margin: 0 0 10px 0;
  }

  .modal-title {
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.25;
    color: #17171a;
    margin: 0 0 14px 0;
  }

  .modal-text {
    font-size: 16px;
    line-height: 1.6;
    color: #4a4640;
    margin: 0;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .modal-actions .action-btn {
    border-color: var(--paper-dim);
    color: #4a4640;
  }
  .modal-actions .action-btn:hover {
    border-color: #17171a;
    color: #17171a;
  }

  @media (max-width: 520px) {
    .modal-overlay { padding: 0; }
    .modal-panel {
      max-width: none;
      max-height: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 24px;
    }
    .modal-title { font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner, .modal-overlay, .modal-panel { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="kicker">Photo Walk</p>
    <h1>Let's roll with it.</h1>
  </header>

  <div class="filmroll">
    <div class="perf"></div>
    <div class="frames-scroll" id="framesScroll"></div>
    <div class="perf"></div>
  </div>

  <p class="hint">scroll the roll, tap a frame to develop it</p>

  <footer>
    <button class="reset-link" id="resetBtn">flip the roll back over</button>
  </footer>

  <div class="add-panel">
    <button class="add-toggle" id="addToggle">+ add a prompt to this roll</button>
    <form class="add-form" id="addForm">
      <label for="promptTitle">Title</label>
      <input type="text" id="promptTitle" placeholder="e.g. Light Through Glass" maxlength="60" required>
      <label for="promptText">Prompt</label>
      <textarea id="promptText" placeholder="Describe the shot to look for." maxlength="240" required></textarea>
      <div class="add-row">
        <button type="submit" class="action-btn">Add to roll</button>
        <span class="add-status" id="addStatus"></span>
      </div>
    </form>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <img class="modal-image" id="modalImage" alt="" hidden>
    <p class="modal-index" id="modalIndex"></p>
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-text" id="modalText"></p>
    <div class="modal-actions">
      <button class="action-btn" id="saveBtn">Save frame</button>
      <button class="action-btn" id="emailBtn">Email it</button>
      <button class="action-btn" id="textBtn">Text it</button>
    </div>
  </div>
</div>

<script>
  // `image` is optional — a URL to a reference photo shown at the top of
  // the enlarged frame. Leave it unset for a text-only prompt.
  const prompts = [
    { title: "Ground as Composition", text: "Shoot straight down. Find a group of people on a textured or patterned surface and let the ground become the composition." },
    { title: "Pure Geometry", text: "Find a staircase, ramp, or scaffold and shoot it as pure geometry — no horizon, no sky, just lines and light." },
    { title: "Reflections Over Objects", text: "Photograph transparent things stacked or overlapping until the reflections matter more than the objects." },
    { title: "Portrait by Reflection", text: "A portrait made entirely through a reflection — mirror, window, spoon — where the reflection distorts or doubles the person." },
    { title: "The Shadow is the Subject", text: "Light a small object so its shadow becomes stranger or more interesting than the object itself." },
    { title: "Scale That Doesn't Add Up", text: "Find something whose scale doesn't make sense in its surroundings — too big, too small, or floating." },
    { title: "Camouflaged Figure", text: "Camouflage a person into a repeating pattern or material until you have to look twice to find them." },
    { title: "Rotate the Ordinary", text: "Take a completely ordinary scene and rotate your framing 90°. Compose for the tilt, don't just tilt your head." },
    { title: "Text as Object", text: "Find something that reads like a menu, label, or invitation — an everyday piece of text-as-object — and make it the whole photo." }
  ];

  let flippedOrder = []; // indices, most recently flipped last
  let activeIndex = null;

  const framesScrollEl = document.getElementById('framesScroll');
  const resetBtn = document.getElementById('resetBtn');
  const modalOverlayEl = document.getElementById('modalOverlay');
  const modalCloseEl = document.getElementById('modalClose');
  const modalImageEl = document.getElementById('modalImage');
  const modalIndexEl = document.getElementById('modalIndex');
  const modalTitleEl = document.getElementById('modalTitle');
  const modalTextEl = document.getElementById('modalText');
  const saveBtn = document.getElementById('saveBtn');
  const emailBtn = document.getElementById('emailBtn');
  const textBtn = document.getElementById('textBtn');
  const addToggle = document.getElementById('addToggle');
  const addForm = document.getElementById('addForm');
  const promptTitleEl = document.getElementById('promptTitle');
  const promptTextEl = document.getElementById('promptText');
  const addStatusEl = document.getElementById('addStatus');

  function makeCard(index) {
    const p = prompts[index];
    const card = document.createElement('div');
    card.className = 'flip-card';
    card.dataset.index = String(index);
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', 'Frame ' + String(index + 1).padStart(2, '0') + ', tap to develop');

    card.innerHTML =
      '<div class="flip-inner">' +
        '<div class="flip-face flip-front">' +
          '<span class="frame-number">' + String(index + 1).padStart(2, '0') + '</span>' +
          '<span class="frame-tap">tap to develop</span>' +
        '</div>' +
        '<div class="flip-face flip-back">' +
          '<p class="back-index">FRAME ' + String(index + 1).padStart(2, '0') + '</p>' +
        '</div>' +
      '</div>';

    card.addEventListener('click', () => selectFrame(index));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectFrame(index);
      }
    });

    return card;
  }

  function buildFrames() {
    framesScrollEl.innerHTML = '';
    prompts.forEach((_, index) => {
      const card = makeCard(index);
      if (flippedOrder.includes(index)) card.classList.add('flipped');
      framesScrollEl.appendChild(card);
    });
  }

  function selectFrame(index) {
    if (!flippedOrder.includes(index)) flippedOrder.push(index);
    const card = framesScrollEl.querySelector('.flip-card[data-index="' + index + '"]');
    if (card) card.classList.add('flipped');
    activeIndex = index;
    openModal(index);
  }

  function openModal(index) {
    const p = prompts[index];
    modalIndexEl.textContent = 'FRAME ' + String(index + 1).padStart(2, '0') + ' / ' + String(prompts.length).padStart(2, '0');
    modalTitleEl.textContent = p.title;
    modalTextEl.textContent = p.text;
    if (p.image) {
      modalImageEl.src = p.image;
      modalImageEl.alt = p.title;
      modalImageEl.hidden = false;
    } else {
      modalImageEl.hidden = true;
      modalImageEl.removeAttribute('src');
    }
    modalOverlayEl.classList.add('open');
    modalCloseEl.focus();
  }

  function closeModal() {
    modalOverlayEl.classList.remove('open');
  }

  function currentPromptText() {
    if (activeIndex === null) return null;
    const p = prompts[activeIndex];
    return {
      label: 'Frame ' + String(activeIndex + 1).padStart(2, '0') + ' of ' + String(prompts.length).padStart(2, '0'),
      title: p.title,
      body: p.text
    };
  }

  function resetRoll() {
    flippedOrder = [];
    activeIndex = null;
    closeModal();
    buildFrames();
  }

  function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  async function saveFrame() {
    const p = currentPromptText();
    if (!p) return;

    try {
      await Promise.all([
        document.fonts.load('italic 40px "Newsreader"'),
        document.fonts.load('500 22px "IBM Plex Mono"')
      ]);
    } catch (e) { /* fonts may already be loaded; proceed regardless */ }

    const W = 900, H = 560;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#1d1d21';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#3a3a3e';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);

    ctx.fillStyle = '#8c8b86';
    ctx.font = '500 15px "IBM Plex Mono", monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(p.label.toUpperCase(), 60, 64);

    ctx.fillStyle = '#f1ece0';
    ctx.font = 'italic 40px "Newsreader", Georgia, serif';
    const titleLines = wrapText(ctx, p.title, W - 120);
    let y = 150;
    titleLines.forEach(line => { ctx.fillText(line, 60, y); y += 48; });

    y += 18;
    ctx.fillStyle = '#e8e4da';
    ctx.font = '26px "Newsreader", Georgia, serif';
    const bodyLines = wrapText(ctx, p.body, W - 120);
    bodyLines.forEach(line => { ctx.fillText(line, 60, y); y += 38; });

    ctx.fillStyle = '#6e3a22';
    ctx.font = '500 13px "IBM Plex Mono", monospace';
    ctx.fillText('PHOTO WALK — BLACK & WHITE ONLY', 60, H - 40);

    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = 'photo-walk-frame-' + String(activeIndex + 1).padStart(2, '0') + '.png';
    link.click();
  }

  function emailFrame() {
    const p = currentPromptText();
    if (!p) return;
    const subject = 'Your photo walk theme: ' + p.title;
    const body = p.label + '\n\n' + p.title + '\n' + p.body;
    window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  function textFrame() {
    const p = currentPromptText();
    if (!p) return;
    const body = p.title + ' — ' + p.body;
    window.location.href = 'sms:?&body=' + encodeURIComponent(body);
  }

  function addPrompt(event) {
    event.preventDefault();
    const title = promptTitleEl.value.trim();
    const text = promptTextEl.value.trim();
    if (!title || !text) return;

    const index = prompts.length;
    prompts.push({ title, text });
    framesScrollEl.appendChild(makeCard(index));

    promptTitleEl.value = '';
    promptTextEl.value = '';
    addStatusEl.textContent = 'added — now ' + prompts.length + ' frames on the roll';
    promptTitleEl.focus();
  }

  resetBtn.addEventListener('click', resetRoll);
  saveBtn.addEventListener('click', saveFrame);
  emailBtn.addEventListener('click', emailFrame);
  textBtn.addEventListener('click', textFrame);
  modalCloseEl.addEventListener('click', closeModal);
  modalOverlayEl.addEventListener('click', (e) => {
    if (e.target === modalOverlayEl) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlayEl.classList.contains('open')) closeModal();
  });
  addToggle.addEventListener('click', () => {
    const open = addForm.classList.toggle('open');
    addToggle.textContent = open ? '– add a prompt to this roll' : '+ add a prompt to this roll';
    if (open) promptTitleEl.focus();
  });
  addForm.addEventListener('submit', addPrompt);

  buildFrames();
</script>

</body>
</html>
