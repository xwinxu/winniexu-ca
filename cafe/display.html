<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Queue</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #2b1710;
      color: #a9cfe4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      padding: 24px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 16px;
      text-align: center;
      color: #b89a84;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .columns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 24px;
      min-height: 0;
    }
    .col {
      background: #3d2217;
      border: 1px solid #5c3a27;
      border-radius: 20px;
      padding: 20px;
      overflow-y: auto;
    }
    .col-title {
      font-size: 1.1rem;
      color: #b89a84;
      margin: 0 0 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .preparing-number {
      font-size: 5rem;
      font-weight: 700;
      text-align: center;
      color: #a9cfe4;
    }
    .preparing-drink {
      text-align: center;
      font-size: 1.2rem;
      color: #a9cfe4;
      margin-top: -8px;
    }
    .ready-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
    }
    .ready-num {
      background: #4a2c1d;
      border: 1px solid #5c3a27;
      color: #a9cfe4;
      border-radius: 16px;
      font-size: 2.4rem;
      font-weight: 700;
      text-align: center;
      padding: 16px 0;
    }
    .empty {
      color: #b89a84;
      font-style: italic;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Confucius Says: Wait Your Turn</h1>
    <div class="columns">
      <div class="col">
        <p class="col-title">Preparing</p>
        <div id="preparing"></div>
      </div>
      <div class="col">
        <p class="col-title">Ready for pickup</p>
        <div class="ready-grid" id="ready"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    function drinkCode(order) {
      const { drinks, cakes = [] } = window.CAFE_CONFIG;
      return drinks
        .concat(cakes)
        .map((d) => {
          const item = order.items.find((i) => i.drinkKey === d.key);
          return item ? item.qty : 0;
        })
        .join(".");
    }

    async function refresh() {
      try {
        const res = await fetch("/api/queue");
        if (!res.ok) return;
        const { preparing, ready } = await res.json();

        const prepEl = document.getElementById("preparing");
        prepEl.innerHTML = preparing.length
          ? preparing
              .map((o) => {
                return `
            <div class="preparing-number">#${o.number}</div>
            <div class="preparing-drink">${drinkCode(o)} ${o.customerName}</div>`;
              })
              .join("")
          : `<p class="empty">No orders in progress</p>`;

        const readyEl = document.getElementById("ready");
        readyEl.innerHTML = ready.length
          ? ready.map((o) => `<div class="ready-num">#${o.number}</div>`).join("")
          : `<p class="empty">No orders ready</p>`;
      } catch (_) {
        // ignore transient network errors
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
