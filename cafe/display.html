<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Queue</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #10110f;
      color: #f5f3ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      padding: 24px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 16px;
      text-align: center;
      color: #9a9a9a;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .columns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 24px;
      min-height: 0;
    }
    .col {
      background: #1a1b18;
      border-radius: 20px;
      padding: 20px;
      overflow-y: auto;
    }
    .col-title {
      font-size: 1.1rem;
      color: #9a9a9a;
      margin: 0 0 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .preparing-number {
      font-size: 5rem;
      font-weight: 700;
      text-align: center;
      color: #ffb454;
    }
    .preparing-drink {
      text-align: center;
      font-size: 1.2rem;
      color: #cfcfcf;
      margin-top: -8px;
    }
    .ready-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
    }
    .ready-num {
      background: #16321f;
      color: #3ddc97;
      border-radius: 16px;
      font-size: 2.4rem;
      font-weight: 700;
      text-align: center;
      padding: 16px 0;
    }
    .empty {
      color: #555;
      font-style: italic;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Pop-up Cafe Queue</h1>
    <div class="columns">
      <div class="col">
        <p class="col-title">Preparing</p>
        <div id="preparing"></div>
      </div>
      <div class="col">
        <p class="col-title">Ready for pickup</p>
        <div class="ready-grid" id="ready"></div>
      </div>
    </div>
  </div>

  <script>
    async function refresh() {
      try {
        const res = await fetch("/api/queue");
        if (!res.ok) return;
        const { preparing, ready } = await res.json();

        const prepEl = document.getElementById("preparing");
        prepEl.innerHTML = preparing.length
          ? preparing
              .map(
                (o) => `
            <div class="preparing-number">#${o.number}</div>
            <div class="preparing-drink">${o.drinkName}</div>`,
              )
              .join("")
          : `<p class="empty">No orders in progress</p>`;

        const readyEl = document.getElementById("ready");
        readyEl.innerHTML = ready.length
          ? ready.map((o) => `<div class="ready-num">#${o.number}</div>`).join("")
          : `<p class="empty">No orders ready</p>`;
      } catch (_) {
        // ignore transient network errors
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
