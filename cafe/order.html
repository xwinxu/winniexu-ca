<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="brand">
    <img src="assets/logo-mark.png" alt="" />
    <span>Confucius Says</span>
  </div>
  <div id="app"></div>

  <script src="config.js"></script>
  <script>
    const STORAGE_KEY = "cafe_order_id";
    const app = document.getElementById("app");
    const LOW_STOCK_RATIO = 0.1; // flag "running low" once remaining stock is at or under 10% of total

    async function fetchInventory() {
      try {
        const res = await fetch("/api/inventory");
        if (!res.ok) return {};
        return await res.json();
      } catch (_) {
        return {};
      }
    }

    async function renderForm() {
      const { drinks } = window.CAFE_CONFIG;
      const inventory = await fetchInventory();
      const cart = {}; // drinkKey -> qty

      app.innerHTML = `
        <h1>What wisdom shall we brew?</h1>
        <p class="sub">Tap a drink to add it &mdash; tap again to add more.</p>
        <div class="drink-grid" id="drink-grid">
          ${drinks
            .map((d) => {
              const stock = inventory[d.key];
              const soldOut = stock && stock.remaining !== null && stock.remaining <= 0;
              const low =
                !soldOut &&
                stock &&
                stock.remaining !== null &&
                stock.total !== null &&
                stock.total > 0 &&
                stock.remaining / stock.total <= LOW_STOCK_RATIO;
              return `
            <button type="button" class="drink-card" data-key="${d.key}" ${soldOut ? "disabled" : ""}>
              <img src="assets/drinks/${d.key}.png" alt="${d.name}" />
              <span class="price-pill">$${d.price.toFixed(2)}</span>
              ${soldOut ? `<span class="sold-out-badge">Sold out</span>` : ""}
              ${low ? `<span class="low-badge">Running low</span>` : ""}
              <span class="qty-badge" hidden>0</span>
            </button>`;
            })
            .join("")}
        </div>
        <div class="card" id="cart-summary" hidden>
          <p class="sub" style="margin:0 0 8px">Your order</p>
          <ul class="queue-list" id="cart-lines"></ul>
          <p style="text-align:right;margin:12px 0 0;font-weight:700" id="cart-total"></p>
        </div>
        <input type="text" id="name" placeholder="Your name" />
        <button class="primary" id="submit" disabled>Place order</button>
      `;

      const grid = document.getElementById("drink-grid");
      const submitBtn = document.getElementById("submit");
      const nameInput = document.getElementById("name");
      const cartSummary = document.getElementById("cart-summary");
      const cartLines = document.getElementById("cart-lines");
      const cartTotal = document.getElementById("cart-total");

      function totalQty() {
        return Object.values(cart).reduce((sum, q) => sum + q, 0);
      }

      function stockCap(key) {
        const stock = inventory[key];
        return stock && stock.remaining !== null ? stock.remaining : Infinity;
      }

      function setQty(key, qty) {
        const clamped = Math.max(0, Math.min(qty, stockCap(key)));
        if (clamped === 0) {
          delete cart[key];
        } else {
          cart[key] = clamped;
        }
        renderCart();
        updateSubmit();
        return clamped;
      }

      function renderCart() {
        const entries = Object.entries(cart).filter(([, qty]) => qty > 0);
        cartSummary.hidden = entries.length === 0;
        cartLines.innerHTML = entries
          .map(([key, qty]) => {
            const d = drinks.find((d) => d.key === key);
            return `
          <li>
            <div class="meta">
              <span class="n">${d.name}</span>
              <span class="d">$${(d.price * qty).toFixed(2)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <input type="number" min="0" inputmode="numeric" class="cart-qty" data-key="${key}" value="${qty}" style="width:60px;margin:0" />
              <button type="button" class="cart-remove" data-key="${key}" aria-label="Remove">&times;</button>
            </div>
          </li>`;
          })
          .join("");
        const total = entries.reduce((sum, [key, qty]) => {
          const d = drinks.find((d) => d.key === key);
          return sum + d.price * qty;
        }, 0);
        cartTotal.textContent = `Total: $${total.toFixed(2)}`;

        grid.querySelectorAll(".drink-card").forEach((btn) => {
          const qty = cart[btn.dataset.key] || 0;
          const badge = btn.querySelector(".qty-badge");
          badge.hidden = qty === 0;
          badge.textContent = qty;
          btn.classList.toggle("selected", qty > 0);
        });
      }

      function updateSubmit() {
        submitBtn.disabled = totalQty() === 0 || !nameInput.value.trim();
      }

      grid.querySelectorAll(".drink-card:not(:disabled)").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.key;
          setQty(key, (cart[key] || 0) + 1);
        });
      });

      cartLines.addEventListener("change", (e) => {
        const input = e.target.closest(".cart-qty");
        if (!input) return;
        const qty = parseInt(input.value, 10);
        const clamped = setQty(input.dataset.key, Number.isNaN(qty) ? 0 : qty);
        if (clamped !== qty) {
          // reflect any clamping (e.g. typed more than remaining stock) back into the field
          const refreshed = cartLines.querySelector(`.cart-qty[data-key="${input.dataset.key}"]`);
          if (refreshed) refreshed.value = clamped;
        }
      });

      cartLines.addEventListener("click", (e) => {
        const btn = e.target.closest(".cart-remove");
        if (!btn) return;
        setQty(btn.dataset.key, 0);
      });

      nameInput.addEventListener("input", updateSubmit);

      submitBtn.addEventListener("click", async () => {
        submitBtn.disabled = true;
        submitBtn.textContent = "Placing order...";
        try {
          const items = Object.entries(cart)
            .filter(([, qty]) => qty > 0)
            .map(([drink, qty]) => ({ drink, qty }));
          const res = await fetch("/api/orders", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ items, name: nameInput.value.trim() }),
          });
          if (res.status === 409) {
            alert("Sorry, one of your drinks just sold out. Please adjust your order.");
            renderForm();
            return;
          }
          if (!res.ok) throw new Error(await res.text());
          const order = await res.json();
          localStorage.setItem(STORAGE_KEY, order.id);
          renderPay(order);
        } catch (err) {
          alert("Something went wrong placing your order. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Place order";
        }
      });
    }

    function itemsSummary(order) {
      return order.items.map((i) => `${i.qty}x ${i.drinkName}`).join(", ");
    }

    function venmoLinks(order) {
      const { venmoUsername } = window.CAFE_CONFIG;
      const note = encodeURIComponent(`Order #${order.number} - ${itemsSummary(order)}`);
      const amount = order.amount.toFixed(2);
      return {
        app: `venmo://paycharge?txn=pay&recipients=${venmoUsername}&amount=${amount}&note=${note}`,
        web: `https://venmo.com/${venmoUsername}?txn=pay&amount=${amount}&note=${note}`,
      };
    }

    function isMobile() {
      return /iphone|ipad|ipod|android/i.test(navigator.userAgent);
    }

    // Tries the Venmo app deep link; if the browser is still in the foreground
    // after a beat (app not installed / didn't open), falls back to venmo.com.
    function openVenmo(links) {
      if (!isMobile()) {
        window.open(links.web, "_blank");
        return;
      }
      let appOpened = false;
      const onVisibilityChange = () => {
        if (document.hidden) appOpened = true;
      };
      document.addEventListener("visibilitychange", onVisibilityChange);
      window.location.href = links.app;
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onVisibilityChange);
        if (!appOpened) {
          window.location.href = links.web;
        }
      }, 1500);
    }

    function renderPay(order) {
      const links = venmoLinks(order);
      app.innerHTML = `
        <h1>Order #${order.number}</h1>
        <p class="sub">${itemsSummary(order)} for ${order.customerName} &middot; $${order.amount.toFixed(2)}</p>
        <div class="card">
          <p>Tap below to pay in the Venmo app. Use the note we filled in so we can match your payment.</p>
          <p style="margin-top:4px"><strong>Note: Order #${order.number}</strong></p>
          <button type="button" id="venmo-pay" class="primary" style="margin-top:12px">
            Pay with Venmo
          </button>
          <a href="${links.web}" style="display:block;text-align:center;margin-top:8px;font-size:0.85rem;color:var(--muted)">
            Don't have the app? Pay on venmo.com
          </a>
        </div>
        <div class="card" id="status-card">
          <p class="sub" style="margin-bottom:4px">Status</p>
          <p id="status-text">Waiting for payment confirmation...</p>
        </div>
      `;
      document.getElementById("venmo-pay").addEventListener("click", () => openVenmo(links));
      pollStatus(order.id);
    }

    function renderQueued(order) {
      app.innerHTML = `
        <h1>You're in the queue!</h1>
        <p class="sub">${itemsSummary(order)} for ${order.customerName}</p>
        <div class="card" style="text-align:center">
          <p class="sub">Your number</p>
          <div class="number">#${order.number}</div>
          <p class="sub" id="live-status">Being prepared...</p>
        </div>
        <button id="new-order" style="width:100%;margin-top:8px">Place another order</button>
      `;
      document.getElementById("new-order").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        renderForm();
      });
      pollStatus(order.id, true);
    }

    let pollTimer = null;
    async function pollStatus(id, alreadyQueued) {
      if (pollTimer) clearTimeout(pollTimer);
      try {
        const res = await fetch(`/api/orders/${id}`);
        if (res.ok) {
          const order = await res.json();
          if (!alreadyQueued && order.status !== "awaiting_payment") {
            renderQueued(order);
            return;
          }
          if (alreadyQueued) {
            const liveStatus = document.getElementById("live-status");
            if (liveStatus) {
              liveStatus.textContent =
                order.status === "ready"
                  ? "Ready for pickup!"
                  : order.status === "picked_up"
                  ? "Picked up. Thanks!"
                  : "Being prepared...";
            }
          }
        }
      } catch (_) {
        // ignore transient network errors, keep polling
      }
      pollTimer = setTimeout(() => pollStatus(id, alreadyQueued), 3000);
    }

    // Resume in-progress order on page reload
    const existingId = localStorage.getItem(STORAGE_KEY);
    if (existingId) {
      fetch(`/api/orders/${existingId}`)
        .then((res) => (res.ok ? res.json() : null))
        .then((order) => {
          if (!order) {
            renderForm();
          } else if (order.status === "awaiting_payment") {
            renderPay(order);
          } else {
            renderQueued(order);
          }
        })
        .catch(() => renderForm());
    } else {
      renderForm();
    }
  </script>
</body>
</html>
