<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-narrow">
    <div class="brand">
      <img src="assets/logo-mark.png" alt="" />
      <span>Confucius Says</span>
    </div>
    <div id="app"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const STORAGE_KEY = "cafe_order_id";
    const app = document.getElementById("app");
    const SLICE_LOW_STOCK_COUNT = 5; // pairings: show the exact remaining count once at or under this

    async function fetchInventory() {
      try {
        const res = await fetch("/api/inventory");
        if (!res.ok) return {};
        return await res.json();
      } catch (_) {
        return {};
      }
    }

    // What's actually left once this cart's own (not-yet-submitted) picks are accounted for.
    // No limit set yet -> treated as not-yet-available, not "unlimited" (returns null).
    function effectiveRemaining(stock, cartQty) {
      if (!stock || stock.total === null || stock.remaining === null) return null;
      return stock.remaining - cartQty;
    }

    // Anticipates what adding to cart will do to stock, not just what's left on the server.
    // Drinks: no "running low" warning anymore, just "Sold out" once your cart would use up what's left.
    // Pairings: show the exact number once your cart would push remaining at/under the count threshold.
    function stockBadgeHtml(stock, cartQty) {
      if (!stock || stock.total === null) return `<span class="sold-out-badge">Not available yet</span>`;
      const remaining = effectiveRemaining(stock, cartQty);
      if (remaining <= 0) return `<span class="sold-out-badge">Sold out (check with staff)</span>`;
      if (stock.section === "drinks") {
        return "";
      }
      if (remaining <= SLICE_LOW_STOCK_COUNT) {
        return `<span class="low-badge">${remaining} left</span>`;
      }
      return "";
    }

    function cardHtml(key, stock) {
      const hasImage = Boolean(stock.imageUrl);
      const remaining0 = effectiveRemaining(stock, 0);
      const unavailable = remaining0 === null || remaining0 <= 0;
      const media = hasImage
        ? `<img src="${stock.imageUrl}" alt="${stock.name}" />`
        : `<div class="cake-placeholder"><span>&#127856;</span><span class="cake-name">${stock.name}</span></div>`;
      return `
      <div class="drink-card${unavailable ? " sold-out" : ""}" data-key="${key}">
        <button type="button" class="drink-tap" data-key="${key}" ${unavailable ? "disabled" : ""}>
          ${media}
        </button>
        <span class="price-pill">$${stock.price.toFixed(2)}</span>
        <span class="stock-badge">${stockBadgeHtml(stock, 0)}</span>
      </div>`;
    }

    async function renderForm() {
      const inventory = await fetchInventory();
      const drinkKeys = Object.keys(inventory).filter((k) => inventory[k].section === "drinks");
      const pairingKeys = Object.keys(inventory).filter((k) => inventory[k].section !== "drinks");
      const cart = {}; // itemKey -> qty

      app.innerHTML = `
        <h1>What wisdom shall we brew?</h1>
        <p class="sub">Tap a drink or slice to add it to your order.</p>
        <div class="drink-grid" id="drink-grid">
          ${drinkKeys.map((k) => cardHtml(k, inventory[k])).join("")}
        </div>
        ${
          pairingKeys.length
            ? `
        <p class="sub" style="margin:4px 0 8px">Seasonal Pairings</p>
        <div class="drink-grid" id="cake-grid">
          ${pairingKeys.map((k) => cardHtml(k, inventory[k])).join("")}
        </div>`
            : ""
        }
        <div class="card" id="cart-summary" hidden>
          <p class="sub" style="margin:0 0 8px">Your order</p>
          <ul class="queue-list" id="cart-lines"></ul>
          <p style="text-align:right;margin:12px 0 0;font-weight:700" id="cart-total"></p>
        </div>
        <input type="text" id="name" placeholder="Your name" />
        <button class="primary" id="submit" disabled>Place order</button>
      `;

      const catalog = document.getElementById("app");
      const submitBtn = document.getElementById("submit");
      const nameInput = document.getElementById("name");
      const cartSummary = document.getElementById("cart-summary");
      const cartLines = document.getElementById("cart-lines");
      const cartTotal = document.getElementById("cart-total");

      function totalQty() {
        return Object.values(cart).reduce((sum, q) => sum + q, 0);
      }

      function stockCap(key) {
        const stock = inventory[key];
        return stock && stock.total !== null && stock.remaining !== null ? stock.remaining : 0;
      }

      function setQty(key, qty) {
        const clamped = Math.max(0, Math.min(qty, stockCap(key)));
        if (clamped === 0) {
          delete cart[key];
        } else {
          cart[key] = clamped;
        }
        renderCart();
        updateSubmit();
        return clamped;
      }

      function renderCart() {
        const entries = Object.entries(cart).filter(([, qty]) => qty > 0);
        cartSummary.hidden = entries.length === 0;
        cartLines.innerHTML = entries
          .map(([key, qty]) => {
            const d = inventory[key];
            return `
          <li>
            <div class="meta">
              <span class="n">${d.name}</span>
              <span class="d">$${(d.price * qty).toFixed(2)}</span>
            </div>
            <div class="cart-stepper">
              <button type="button" class="cart-minus" data-key="${key}" aria-label="Remove one">&minus;</button>
              <span class="cart-qty-value">${qty}</span>
              <button type="button" class="cart-plus" data-key="${key}" aria-label="Add one">+</button>
              <button type="button" class="cart-remove" data-key="${key}" aria-label="Remove">&times;</button>
            </div>
          </li>`;
          })
          .join("");
        const total = entries.reduce((sum, [key, qty]) => {
          const d = inventory[key];
          return sum + d.price * qty;
        }, 0);
        cartTotal.textContent = `Total: $${total.toFixed(2)}`;

        catalog.querySelectorAll(".drink-card").forEach((card) => {
          const key = card.dataset.key;
          const qty = cart[key] || 0;
          const stock = inventory[key];
          const remaining = effectiveRemaining(stock, qty);
          const atCap = remaining === null || remaining <= 0;

          card.classList.toggle("selected", qty > 0);
          card.classList.toggle("sold-out", atCap);
          card.querySelector(".drink-tap").disabled = atCap;
          card.querySelector(".stock-badge").innerHTML = stockBadgeHtml(stock, qty);
        });
      }

      function updateSubmit() {
        submitBtn.disabled = totalQty() === 0 || !nameInput.value.trim();
      }

      catalog.addEventListener("click", (e) => {
        const tap = e.target.closest(".drink-tap");
        if (tap && !tap.disabled) {
          setQty(tap.dataset.key, (cart[tap.dataset.key] || 0) + 1);
        }
      });

      cartLines.addEventListener("click", (e) => {
        const plus = e.target.closest(".cart-plus");
        const minus = e.target.closest(".cart-minus");
        const remove = e.target.closest(".cart-remove");
        if (plus) {
          setQty(plus.dataset.key, (cart[plus.dataset.key] || 0) + 1);
          return;
        }
        if (minus) {
          setQty(minus.dataset.key, (cart[minus.dataset.key] || 0) - 1);
          return;
        }
        if (!remove) return;
        setQty(remove.dataset.key, 0);
      });

      nameInput.addEventListener("input", updateSubmit);

      submitBtn.addEventListener("click", async () => {
        submitBtn.disabled = true;
        submitBtn.textContent = "Placing order...";
        try {
          const items = Object.entries(cart)
            .filter(([, qty]) => qty > 0)
            .map(([drink, qty]) => ({ drink, qty }));
          const res = await fetch("/api/orders", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ items, name: nameInput.value.trim() }),
          });
          if (res.status === 409) {
            alert("Sorry, one of your items just sold out or isn't available yet. Please adjust your order.");
            renderForm();
            return;
          }
          if (!res.ok) throw new Error(await res.text());
          const order = await res.json();
          localStorage.setItem(STORAGE_KEY, order.id);
          renderPay(order);
        } catch (err) {
          alert("Something went wrong placing your order. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Place order";
        }
      });
    }

    function itemsSummary(order) {
      return order.items.map((i) => `${i.qty}x ${i.drinkName}`).join(", ");
    }

    function venmoLinks(order) {
      const { venmoUsername } = window.CAFE_CONFIG;
      const note = encodeURIComponent(`Order #${order.number} - ${itemsSummary(order)}`);
      const amount = order.amount.toFixed(2);
      return {
        app: `venmo://paycharge?txn=pay&recipients=${venmoUsername}&amount=${amount}&note=${note}`,
        web: `https://venmo.com/${venmoUsername}?txn=pay&amount=${amount}&note=${note}`,
      };
    }

    function isMobile() {
      return /iphone|ipad|ipod|android/i.test(navigator.userAgent);
    }

    // Tries the Venmo app deep link; if the browser is still in the foreground
    // after a beat (app not installed / didn't open), falls back to venmo.com.
    function openVenmo(links) {
      if (!isMobile()) {
        window.open(links.web, "_blank");
        return;
      }
      let appOpened = false;
      const onVisibilityChange = () => {
        if (document.hidden) appOpened = true;
      };
      document.addEventListener("visibilitychange", onVisibilityChange);
      window.location.href = links.app;
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onVisibilityChange);
        if (!appOpened) {
          window.location.href = links.web;
        }
      }, 1500);
    }

    function renderPay(order) {
      const links = venmoLinks(order);
      app.innerHTML = `
        <h1>Order #${order.number}</h1>
        <p class="sub">${itemsSummary(order)} for ${order.customerName} &middot; $${order.amount.toFixed(2)}</p>
        <div class="card">
          <p>Tap below to pay in the Venmo app. Use the note we filled in so we can match your payment.</p>
          <p style="margin-top:4px"><strong>Note: Order #${order.number}</strong></p>
          <button type="button" id="venmo-pay" class="primary" style="margin-top:12px">
            Pay with Venmo
          </button>
          <a href="${links.web}" style="display:block;text-align:center;margin-top:8px;font-size:0.85rem;color:var(--muted)">
            Don't have the app? Pay on venmo.com
          </a>
        </div>
        <div class="card" id="status-card">
          <p class="sub" style="margin-bottom:4px">Status</p>
          <p id="status-text">Waiting for payment confirmation...</p>
        </div>
      `;
      document.getElementById("venmo-pay").addEventListener("click", () => openVenmo(links));
      pollStatus(order.id);
    }

    function renderQueued(order) {
      app.innerHTML = `
        <h1>You're in the queue!</h1>
        <p class="sub">${itemsSummary(order)} for ${order.customerName}</p>
        <div class="card" style="text-align:center">
          <p class="sub">Your number</p>
          <div class="number">#${order.number}</div>
          <p class="sub" id="live-status">Being prepared...</p>
        </div>
        <button id="new-order" style="width:100%;margin-top:8px">Place another order</button>
      `;
      document.getElementById("new-order").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        renderForm();
      });
      pollStatus(order.id, true);
    }

    let pollTimer = null;
    async function pollStatus(id, alreadyQueued) {
      if (pollTimer) clearTimeout(pollTimer);
      try {
        const res = await fetch(`/api/orders/${id}`);
        if (res.ok) {
          const order = await res.json();
          if (!alreadyQueued && order.status !== "awaiting_payment") {
            renderQueued(order);
            return;
          }
          if (alreadyQueued) {
            const liveStatus = document.getElementById("live-status");
            if (liveStatus) {
              liveStatus.textContent =
                order.status === "ready"
                  ? "Ready for pickup!"
                  : order.status === "picked_up"
                  ? "Picked up. Thanks!"
                  : "Being prepared...";
            }
          }
        }
      } catch (_) {
        // ignore transient network errors, keep polling
      }
      pollTimer = setTimeout(() => pollStatus(id, alreadyQueued), 3000);
    }

    // Resume in-progress order on page reload
    const existingId = localStorage.getItem(STORAGE_KEY);
    if (existingId) {
      fetch(`/api/orders/${existingId}`)
        .then((res) => (res.ok ? res.json() : null))
        .then((order) => {
          if (!order) {
            renderForm();
          } else if (order.status === "awaiting_payment") {
            renderPay(order);
          } else {
            renderQueued(order);
          }
        })
        .catch(() => renderForm());
    } else {
      renderForm();
    }
  </script>
</body>
</html>
