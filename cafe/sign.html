<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order here</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0;
    }
    p {
      font-size: 1.3rem;
      margin: 0;
      color: #444;
    }
    img {
      width: min(70vw, 420px);
      height: auto;
    }
    @media print {
      .wrap { height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Scan to order</h1>
    <img src="assets/qr-large.svg" alt="QR code to order page" />
    <p>Pay with Venmo &middot; watch for your number on screen</p>
  </div>
</body>
</html>
