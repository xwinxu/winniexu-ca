<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order here</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #2b1710;
      color: #ecdfd0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      height: 36px;
      width: 36px;
    }
    .brand span {
      color: #b89a84;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0;
      color: #a9cfe4;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .qr-card img {
      display: block;
      width: min(60vw, 360px);
      height: auto;
    }
    p {
      font-size: 1.2rem;
      margin: 0;
      color: #b89a84;
    }
    @media print {
      .wrap { height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="assets/logo-mark.png" alt="" />
      <span>Confucius Says</span>
    </div>
    <h1>Scan to order</h1>
    <div class="qr-card">
      <img src="assets/qr-large.svg" alt="QR code to order page" />
    </div>
    <p>Pay with Venmo &middot; watch for your number on screen</p>
  </div>
</body>
</html>
